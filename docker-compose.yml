services:
  n8n:
    image: n8nio/n8n:latest
    container_name: n8n
    restart: unless-stopped

    ports:
      - "5678:5678"

    environment:
      - N8N_PORT=5678
      - NODE_ENV=production
      - GENERIC_TIMEZONE=America/Fortaleza
      - TZ=America/Fortaleza

    volumes:
      - ./data:/home/node/.n8n
